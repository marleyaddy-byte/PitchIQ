<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="PitchIQ Football Development Platform"
    >

    <title>PitchIQ | Football Development</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >
</head>

<body>

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                P
            </div>

            <div class="brand-text">
                <h1>PitchIQ</h1>
                <span>DEVELOPMENT</span>
            </div>

        </div>


        <!-- Navigation -->

        <nav class="sidebar-nav">

            <a
                href="#"
                class="nav-item active"
                data-page="Dashboard"
            >
                <span class="nav-icon">⌂</span>
                <span>Dashboard</span>
            </a>


            <a
                href="#"
                class="nav-item"
                data-page="Training"
            >
                <span class="nav-icon">⚽</span>
                <span>Training</span>
            </a>


            <a
                href="#"
                class="nav-item"
                data-page="Drills"
            >
                <span class="nav-icon">◉</span>
                <span>Drills</span>
            </a>


            <a
                href="#"
                class="nav-item"
                data-page="Progress"
            >
                <span class="nav-icon">↗</span>
                <span>Progress</span>
            </a>


            <a
                href="#"
                class="nav-item"
                data-page="History"
            >
                <span class="nav-icon">◷</span>
                <span>History</span>
            </a>


            <a
                href="#"
                class="nav-item"
                data-page="Profile"
            >
                <span class="nav-icon">♙</span>
                <span>Profile</span>
            </a>


            <a
                href="#"
                class="nav-item"
                data-page="Settings"
            >
                <span class="nav-icon">⚙</span>
                <span>Settings</span>
            </a>

        </nav>


        <!-- Sidebar Footer -->

        <div class="sidebar-footer">

            <div class="sidebar-profile">

                <div class="sidebar-avatar">
                    M
                </div>

                <div class="sidebar-profile-info">
                    <strong>Marley</strong>
                    <span>CAM</span>
                </div>

            </div>

        </div>

    </aside>


    <!-- =====================================================
         MAIN APPLICATION

         app.js renders the Dashboard and every other page here.
         Keeping this empty prevents old placeholder Dashboard
         values from appearing again after a refresh.
    ====================================================== -->

    <main class="main-content"></main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="/app.js?v=1001"></script>

</body>

</html>
